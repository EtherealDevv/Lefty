name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: cargo check --manifest-path engine_native/Cargo.toml
      - run: cargo check --manifest-path tauri-app/src-tauri/Cargo.toml
      - run: npm ci
        working-directory: tauri-app
      - run: npm run build
        working-directory: tauri-app

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm ci
        working-directory: tauri-app
      - run: npx tauri build
        working-directory: tauri-app
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            tauri-app/src-tauri/target/release/bundle/msi/*.msi
            tauri-app/src-tauri/target/release/bundle/nsis/*-setup.exe
