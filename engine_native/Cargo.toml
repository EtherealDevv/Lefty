[package]
name = "lefty_engine"
version = "0.1.0"
edition = "2021"
description = "Lefty native engine - low-level keyboard hook (WH_KEYBOARD_LL, SendInput, TIME_CRITICAL, no GIL)"
authors = ["Lefty"]
license = "MIT"

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_SystemServices",
    "Win32_Foundation",
    "Win32_Graphics_Gdi"
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
